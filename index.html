<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDER TV — TV EN VIVO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --red:#E50914; --red-dark:#B00710;
    --green:#46d369; --text:#E5E5E5; --text-dim:#808080;
    --card:#141414; --card-hover:#1f1f1f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:#000;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}

  /* ===== HEADER ===== */
  .header{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);padding:16px 40px;display:flex;align-items:center;justify-content:space-between;transition:background .3s;}
  .header.scrolled{background:rgba(0,0,0,.95);box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .logo{font-family:'Bebas Neue',sans-serif;color:var(--red);font-size:28px;letter-spacing:2px;}
  .logo span{color:#fff;font-family:'Roboto';font-size:14px;letter-spacing:0;margin-left:8px;}
  .header-right{display:flex;align-items:center;gap:20px;}
  .search-box{background:rgba(51,51,51,.6);border:1px solid transparent;border-radius:4px;padding:8px 14px;color:#fff;font-size:14px;width:260px;outline:none;transition:all .2s;}
  .search-box:focus{background:rgba(30,30,30,.9);border-color:var(--red);}
  .admin-link{color:var(--text-dim);font-size:13px;padding:6px 12px;border:1px solid #333;border-radius:4px;transition:all .2s;}
  .admin-link:hover{color:#fff;border-color:#666;}

  /* ===== HERO / REPRODUCTOR ===== */
  .hero-section{padding-top:80px;}
  .player-container{position:relative;width:100%;background:#0a0a0a;aspect-ratio:16/9;max-height:75vh;display:flex;align-items:center;justify-content:center;}
  .video-player{width:100%;height:100%;background:#000;}
  .player-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);height:100%;min-height:300px;}
  .player-placeholder svg{width:80px;height:80px;margin-bottom:20px;opacity:.4;}
  .channel-info-bar{background:linear-gradient(to top,rgba(0,0,0,.95),transparent);padding:24px 40px 40px;margin-top:-80px;position:relative;z-index:2;pointer-events:none;}
  .channel-title{font-size:36px;font-weight:700;margin-bottom:8px;}
  .channel-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .live-badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;}
  .live-badge::before{content:'';width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  .meta-item{font-size:14px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .channel-desc{font-size:15px;color:#ccc;max-width:700px;line-height:1.6;}
  .player-actions{padding:0 40px 24px;display:flex;gap:12px;flex-wrap:wrap;}
  .btn-primary{background:var(--red);color:#fff;padding:12px 24px;border-radius:4px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-secondary{background:rgba(109,109,110,.6);color:#fff;padding:12px 24px;border-radius:4px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s;}
  .btn-secondary:hover{background:rgba(109,109,110,.8);}

  /* ===== CATEGORÍAS ===== */
  .categories-wrap{padding:20px 40px 60px;}
  .category-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;}
  .category-tab{background:transparent;color:var(--text-dim);border:1px solid #333;padding:8px 18px;border-radius:20px;font-size:14px;transition:all .2s;}
  .category-tab:hover, .category-tab.active{border-color:var(--red);color:#fff;background:rgba(229,9,20,.1);}
  .section-title{font-size:22px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:24px;}
  @media(min-width:500px){.channels-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}}
  @media(min-width:900px){.channels-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}

  /* ===== TARJETA DE CANAL ===== */
  .channel-card{background:var(--card);border-radius:6px;overflow-hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;}
  .channel-card:hover{transform:scale(1.05);box-shadow:0 8px 24px rgba(0,0,0,.5);background:var(--card-hover);z-index:10;position:relative;}
  .card-logo-wrap{aspect-ratio:16/9;background:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:12px;}
  .card-logo{max-width:85%;max-height:85%;object-fit:contain;}
  .card-info{padding:12px;}
  .card-name{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;}
  .card-live{color:var(--red);font-weight:600;font-size:11px;display:flex;align-items:center;gap:4px;}
  .card-live::before{content:'●';font-size:10px;}

  /* ===== ESTADOS ===== */
  .empty-state{text-align:center;padding:80px 20px;color:var(--text-dim);}
  .empty-state svg{width:60px;height:60px;margin-bottom:16px;opacity:.3;}
  .loading-state{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text-dim);}
  .spinner{width:24px;height:24px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== RESPONSIVE ===== */
  @media(max-width:900px){
    .header{padding:12px 16px;}
    .search-box{width:180px;}
    .channel-info-bar{padding:20px 16px 30px;}
    .channel-title{font-size:26px;}
    .player-actions{padding:0 16px 20px;}
    .categories-wrap{padding:16px;}
    .channels-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px;}
  }
  @media(max-width:600px){
    .search-box{display:none;}
    .channel-meta{flex-direction:column;align-items:flex-start;gap:6px;}
  }
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header" id="header">
  <div class="logo">RIDER TV <span>TV EN VIVO</span></div>
  <div class="header-right">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Buscar canal…">
    <a href="admin.html" class="admin-link">⚙️ Admin</a>
  </div>
</header>

<!-- ================= REPRODUCTOR DESTACADO ================= -->
<section class="hero-section">
  <div class="player-container" id="playerContainer">
    <div class="player-placeholder" id="playerPlaceholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        <path d="M15.94 11.56a5 5 0 1 1-7.88 0 5 5 0 0 1 7.88 0z"/>
        <path d="M9 10v4l3-2 3 2v-4"/>
      </svg>
      <p>Selecciona un canal para ver en vivo</p>
    </div>
    <video class="video-player" id="videoPlayer" controls playsinline style="display:none;"></video>
  </div>

  <div class="channel-info-bar" id="channelInfoBar" style="display:none;">
    <h1 class="channel-title" id="chName">—</h1>
    <div class="channel-meta">
      <span class="live-badge">EN VIVO</span>
      <span class="meta-item" id="chCategory">—</span>
      <span class="meta-item" id="chCountry">—</span>
      <span class="meta-item" id="chLang">—</span>
      <span class="meta-item" id="chRating">⭐ —</span>
    </div>
    <p class="channel-desc" id="chDesc">—</p>
  </div>

  <div class="player-actions" id="playerActions" style="display:none;">
    <button class="btn-primary" id="btnPlay">▶️ Reproducir</button>
    <button class="btn-secondary" id="btnFullscreen">⛶ Pantalla completa</button>
  </div>
</section>

<!-- ================= CATÁLOGO DE CANALES ================= -->
<section class="categories-wrap">
  <div class="category-tabs" id="categoryTabs">
    <button class="category-tab active" data-category="all">📺 Todos</button>
    <button class="category-tab" data-category="Noticias">📰 Noticias</button>
    <button class="category-tab" data-category="Deportes">⚽ Deportes</button>
    <button class="category-tab" data-category="Entretenimiento">🎬 Entretenimiento</button>
    <button class="category-tab" data-category="Películas">🎞️ Películas</button>
    <button class="category-tab" data-category="Infantil">🧒 Infantil</button>
    <button class="category-tab" data-category="Música">🎵 Música</button>
    <button class="category-tab" data-category="Educativo">📚 Educativo</button>
    <button class="category-tab" data-category="Internacional">🌍 Internacional</button>
    <button class="category-tab" data-category="Religioso">✝️ Religioso</button>
    <button class="category-tab" data-category="Otros">📺 Otros</button>
  </div>

  <h2 class="section-title">📡 Canales en Vivo</h2>

  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <span>Cargando canales…</span>
  </div>

  <div class="channels-grid" id="channelsGrid" style="display:none;"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="7" width="20" height="14" rx="2"/>
      <path d="M17 21H7"/>
      <path d="M12 11v4"/>
      <path d="M9 13h6"/>
    </svg>
    <h3>No hay canales disponibles</h3>
    <p>Agrega canales desde el panel de administración.</p>
  </div>
</section>

<!-- ================= FIREBASE ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-firestore-compat.min.js"></script>
<script>
// ==============================================
// 🔥 TU FIREBASE — MISMA CONFIGURACIÓN
// ==============================================
const firebaseConfig = {
  apiKey: "AIzaSyAUDEEpWkNe6c0906r6zrO4SrBuY9j3C6I",
  authDomain: "ridertv-channel.firebaseapp.com",
  projectId: "ridertv-channel",
  storageBucket: "ridertv-channel.firebasestorage.app",
  messagingSenderId: "565981479941",
  appId: "1:565981479941:web:d81f0e0ff3eeec3b6f086c",
  measurementId: "G-7KEJSY65T3"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION_NAME = "canales_tv";

function $(sel){ return document.querySelector(sel); }

// ========== ESTADO ==========
let ALL_CHANNELS = [];
let FILTERED = [];
let SELECTED_CHANNEL = null;
let currentCategory = "all";

// ========== HEADER SCROLL ==========
window.addEventListener("scroll", ()=>{
  if(window.scrollY > 40) $("#header").classList.add("scrolled");
  else $("#header").classList.remove("scrolled");
});

// ========== CARGAR CANALES DESDE FIREBASE ==========
function loadChannels(){
  db.collection(COLLECTION_NAME).orderBy("title", "asc")
    .onSnapshot(snap=>{
      ALL_CHANNELS = snap.docs.map(d=> ({ id: d.id, ...d.data() }));
      applyFilters();
      $("#loadingState").style.display = "none";
    }, err=>{
      console.error("Error cargando canales:", err);
      $("#loadingState").innerHTML = "<span style='color:var(--red);'>❌ Error al cargar canales</span>";
    });
}

// ========== FILTROS Y BÚSQUEDA ==========
function applyFilters(){
  let list = [...ALL_CHANNELS];

  // Filtrar por categoría
  if(currentCategory !== "all"){
    list = list.filter(c => c.category === currentCategory);
  }

  // Filtrar por búsqueda
  const q = $("#searchInput").value.trim().toLowerCase();
  if(q){
    list = list.filter(c => 
      (c.title || "").toLowerCase().includes(q) ||
      (c.country || "").toLowerCase().includes(q) ||
      (c.language || "").toLowerCase().includes(q)
    );
  }

  FILTERED = list;
  renderChannels();
}

// Clic en categoría
document.querySelectorAll(".category-tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".category-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    currentCategory = tab.dataset.category;
    applyFilters();
  });
});

// Búsqueda en tiempo real
$("#searchInput").addEventListener("input", applyFilters);

// ========== RENDERIZAR CANALES ==========
function renderChannels(){
  const grid = $("#channelsGrid");
  const empty = $("#emptyState");

  if(FILTERED.length === 0){
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  grid.style.display = "grid";

  grid.innerHTML = FILTERED.map(channel => `
    <div class="channel-card" data-id="${channel.id}">
      <div class="card-logo-wrap">
        <img class="card-logo" src="${channel.imageUrl}" alt="${escapeHtml(channel.title)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23666%22><path d=%22M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z%22/><path d=%22M9 10v4l3-2 3 2v-4%22/></svg>'">
      </div>
      <div class="card-info">
        <h3 class="card-name">${escapeHtml(channel.title)}</h3>
        <div class="card-meta">
          <span>${channel.country || "—"}</span>
          <span class="card-live">EN VIVO</span>
        </div>
      </div>
    </div>
  `).join("");

  // Clic para seleccionar canal
  grid.querySelectorAll(".channel-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      const ch = ALL_CHANNELS.find(c => c.id === card.dataset.id);
      if(ch) selectChannel(ch);
    });
  });
}

// ========== SELECCIONAR CANAL Y REPRODUCIR ==========
function selectChannel(channel){
  SELECTED_CHANNEL = channel;

  // Ocultar placeholder, mostrar reproductor
  $("#playerPlaceholder").style.display = "none";
  $("#videoPlayer").style.display = "block";
  $("#channelInfoBar").style.display = "block";
  $("#playerActions").style.display = "flex";

  // Llenar información
  $("#chName").textContent = channel.title || "Canal sin nombre";
  $("#chCategory").textContent = channel.category || "—";
  $("#chCountry").textContent = channel.country || "—";
  $("#chLang").textContent = channel.language || "—";
  $("#chRating").textContent = channel.rating ? `⭐ ${Number(channel.rating).toFixed(1)}` : "—";
  $("#chDesc").textContent = channel.description || "Sin descripción disponible.";

  // Cargar fuente de video
  const player = $("#videoPlayer");
  player.src = channel.streamUrl;
  player.load();

  // Scroll suave al reproductor
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Botones de acción
$("#btnPlay").addEventListener("click", ()=>{
  const p = $("#videoPlayer");
  p.paused ? p.play() : p.pause();
  $("#btnPlay").innerHTML = p.paused ? "▶️ Reproducir" : "⏸️ Pausa";
});

$("#videoPlayer").addEventListener("play", ()=> $("#btnPlay").innerHTML = "⏸️ Pausa");
$("#videoPlayer").addEventListener("pause", ()=> $("#btnPlay").innerHTML = "▶️ Reproducir");

$("#btnFullscreen").addEventListener("click", ()=>{
  const p = $("#videoPlayer");
  if(p.requestFullscreen) p.requestFullscreen();
  else if(p.webkitRequestFullscreen) p.webkitRequestFullscreen();
  else if(p.msRequestFullscreen) p.msRequestFullscreen();
});

// ========== UTILIDADES ==========
function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ========== INICIO ==========
document.addEventListener("DOMContentLoaded", loadChannels);
</script>
</body>
</html>
